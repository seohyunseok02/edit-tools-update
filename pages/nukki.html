<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>누끼 따기</title>
<style>
/* 누끼 따기: 사진에서 원하는 부분만 골라 배경이 투명한 PNG로 저장. AI(클릭·자동 찾기)·붓·색상 선택을 섞어 쓴다. AI는 이 PC에서 돈다 */
:root{--bg:#eef0f4;--panel:#fbfcfe;--ink:#171b24;--mute:#4f5868;--line:#d2d8e2;--accent:#1f5fbf;--accent-ink:#fff;--warn:#8a3a0a;--warn-soft:#fbe9d9;
  --font:"Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--panel:#181c26;--ink:#e6eaf2;--mute:#a4adbf;--line:#2b3140;--accent:#7fb0ff;--accent-ink:#0a1830;--warn:#f0a36b;--warn-soft:#3a2415;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131a;--panel:#181c26;--ink:#e6eaf2;--mute:#a4adbf;--line:#2b3140;--accent:#7fb0ff;--accent-ink:#0a1830;--warn:#f0a36b;--warn-soft:#3a2415;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);padding:20px 16px 48px;margin:0}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0}
header p,.note{color:var(--mute);margin:4px 0 0;font-size:14px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--mute)}
.drop.on{border-color:var(--accent);color:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 12px}
button:disabled{opacity:.5;cursor:default}
button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.sl{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mute)}
.sep{width:1px;align-self:stretch;background:var(--line)}
.msg{border-radius:7px;padding:8px 12px;background:var(--warn-soft);color:var(--warn);font-size:13px;white-space:pre-wrap}
.stage{position:relative;align-self:center;max-width:100%;line-height:0;touch-action:none;user-select:none}
.stage canvas{max-width:100%;height:auto;display:block}
.stage #ov{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.stage.check{background:repeating-conic-gradient(#cfd3da 0 25%,#fff 0 50%) 0 0/20px 20px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:13px;padding:4px 10px;border-radius:999px}
</style>

<div class="wrap">
  <header>
    <h1>누끼 따기</h1>
    <p>사진을 넣고 원하는 부분을 고른 뒤 배경이 투명한 PNG로 저장합니다. 고르는 방법은 섞어 쓸 수 있습니다: <b>AI 클릭</b>(물체를 누르면 윤곽을 잡음, 오른쪽 클릭은 빼기) · <b>자동 찾기</b>(사진 속 물체 목록에서 고르기) · <b>붓</b> · <b>색상</b>(누른 곳과 비슷한 색). AI는 이 PC에서 돌고 사진은 밖으로 나가지 않습니다. 처음 한 번은 AI 파일(약 60MB)을 받느라 인터넷이 필요합니다.</p>
  </header>
  <section>
    <div class="drop" id="drop">사진(PNG·JPG)을 여기에 끌어다 놓거나 <button id="btnPick">사진 고르기</button><input type="file" id="file" accept="image/*" hidden></div>
    <div class="msg" id="err" hidden></div>
    <div id="tools" hidden>
      <div class="bar">
        <button data-tool="ai" class="on">AI 클릭</button><button data-tool="brush">붓</button><button data-tool="color">색상</button>
        <span class="sep"></span>
        <button data-op="add" class="on">더하기</button><button data-op="sub">빼기</button>
        <span class="sep"></span>
        <button id="btnNext" title="지금 잡은 물체를 확정하고 다른 물체를 새로 고릅니다">다음 물체</button>
        <button id="btnAuto">자동으로 물체 찾기</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="bar">
        <label class="sl" id="slBrush" hidden>붓 크기 <input type="range" id="brush" min="2" max="200" value="30"></label>
        <label class="sl" id="slTol" hidden>색 허용 범위 <input type="range" id="tol" min="1" max="120" value="30"> <label><input type="checkbox" id="contig" checked> 이어진 부분만</label></label>
        <label class="sl">가장자리 부드럽게 <input type="range" id="feather" min="0" max="8" value="1"></label>
        <span class="sep"></span>
        <button id="btnUndo" title="Ctrl+Z">되돌리기</button><button id="btnInvert">선택 반전</button><button id="btnClear">선택 모두 지우기</button>
        <button id="btnPrev">결과 미리보기</button>
        <button class="pri" id="btnSave">투명 PNG로 저장</button>
      </div>
      <p class="note" id="state"></p>
    </div>
    <div class="stage" id="stage" hidden><canvas id="cv"></canvas><canvas id="ov"></canvas></div>
  </section>
</div>
<script>
'use strict';
/* 쇼츠 자동화 엔진: 프리미어 .prproj(XML)를 읽고, 미드폼 구간을 쇼츠 디자인 프로젝트로 옮겨 넣는다.
   브라우저 DOM API만 쓴다. 텍스트 교체·클립 복제 부분은 자막도구.html에서 검증된 방식을 따른다. */
const TICKS = 254016000000;
const VIDEO_EXT = /\.(mp4|mov|mxf|mts|m2ts|avi|mkv|r3d|braw|webm)$/i;

const AUD_EXT = /\.(wav|mp3|aac|m4a|aiff?|flac|ogg)$/i;

function ch(n, ...names) { for (const nm of names) { if (!n) return null; let f = null; for (let c = n.firstElementChild; c; c = c.nextElementSibling) if (c.tagName === nm) { f = c; break; } n = f; } return n; }
function chs(n, nm) { const r = []; if (n) for (let c = n.firstElementChild; c; c = c.nextElementSibling) if (c.tagName === nm) r.push(c); return r; }
function txt(n) { return n ? n.textContent : ''; }
function baseName(p) { return String(p || '').replace(/\\/g, '/').split('/').pop(); }
function fmtNum(v) { const r = Math.round(v * 1e6) / 1e6; return Number.isInteger(r) ? r + '.' : String(r); }

/* ---------------- 텍스트 데이터 (스키마 없는 FlatBuffer) ---------------- */
const BASE = 12;
const utf8 = new TextDecoder('utf-8', { fatal: true });
function fbParse(b) {

    if (q + 4 > N) return false; const L = u32(q); if (L === 0 || q + 4 + L >= N || b[q + 4 + L] !== 0) return false;

  }

    if (vt < BASE || vt + 4 > N || (vt - BASE) % 2) return false; const vs = u16(vt), ts = u16(vt + 2);
    if (vs < 4 || vs % 2 || vt + vs > N || ts < 4 || t + ts > N) return false;
    for (let i = 4; i < vs; i += 2) { const fo = u16(vt + i); if (fo && (fo < 4 || fo >= ts)) return false; }
    return true;
  }
  function vecOffsetsOk(q) {
    const n = u32(q); if (n === 0 || n > 4096 || q + 4 + 4 * n > N) return false;
    for (let i = 0; i < n; i++) { const e = q + 4 + 4 * i, t = e + u32(e); if (u32(e) === 0 || t >= N || !al4(t) || !(isStr(t) || tableOk(t))) return false; }
    return true;
  }

    if (objs.has(q)) return true;

    if (n > 0 && q + 4 + 4 * n <= N && vecOffsetsOk(q)) {
      objs.set(q, 'v'); starts.add(q);
      for (let i = 0; i < n; i++) { const e = q + 4 + 4 * i; const t = e + u32(e); refs.push({ p: e, q: t, k: 'u' }); obj(t, { vec: q }); }

    const sorted = [...new Set(fos)].sort((a, c) => a - c);

    const q = p - bdv.getInt32(p, true);
    if (vts.has(q) && q !== p && ((p < S) !== (q < S))) P.refs.push({ p, q, k: 's' });
  }

  const oldL = lensOf(s.text), runs = [];

    const n = bdv.getUint32(q, true); if (n < 1 || n > 64 || q + 4 + 4 * n > b.length) continue;

    if (vals.some(v => v > 1e6)) continue;

  const delta = nb - old;

  out.set(b.subarray(0, S), 0); dv.setUint32(S, enc.length, true); out.set(enc, S + 4); out.set(b.subarray(E), S + nb);
  const mp = x => x >= E ? x + delta : x;
  for (const r of P.refs) { const p = mp(r.p), q = mp(r.q); if (r.k === 'u') dv.setUint32(p, q - p, true); else dv.setInt32(p, p - q, true); }

  for (const R of runs) {
    const v = R.vals.slice(); let d = newL[R.u] + R.extra - v.reduce((a, c) => a + c, 0);
    if (d > 0) v[v.length - 1] += d;
    for (let i = v.length - 1; d < 0 && i >= 0; i--) { const t = Math.min(v[i] - (i ? 1 : 0), -d); if (t > 0) { v[i] -= t; d += t; } }
    for (let i = v.length - 1; d < 0 && i >= 0; i--) { const t = Math.min(v[i], -d); v[i] -= t; d += t; }
    const q2 = mp(R.q); v.forEach((x, i) => dv.setUint32(q2 + 4 + 4 * i, x, true));

}
/* 한 레이어의 글자는 서식이 바뀌는 곳마다 여러 조각으로 저장될 수 있다. 레이어 이름과 맞춰 화면 순서대로 돌려준다. */
function textParts(b, inst) {
  const P = fbParse(b); const norm = t => t.replace(/[\r\n]+/g, ' ').trim(); const name = norm(inst || '');

    const out = []; let pos = 0; for (const x of c) { if (x.at >= pos) { out.push(x.t); pos = x.at + norm(x.t).length; } }

/* 텍스트 데이터에 적힌 글꼴 이름 */
function fbFont(b, parts) { const P = fbParse(b); const f = P.strings.map(x => x.text).filter(t => /^[A-Za-z][A-Za-z0-9 _.-]{3,}$/.test(t) && !parts.includes(t)); return f[0] || ''; }

  _reg(n) {

  }

  _delHash(e) { const l = this.hashIdx.get(e.getAttribute('BinaryHash')); if (l) { const i = l.indexOf(e); if (i >= 0) l.splice(i, 1); } }
  hashContent(h) { const c = (this.hashIdx.get(h) || []).find(e => e.textContent.trim()); return c ? c.textContent : null; }

  /* ----- 읽기 ----- */
  seqs() {
    return chs(this.root, 'Sequence').map(s => {
      const o = { node: s, name: txt(ch(s, 'Name')) || '(이름 없음)', w: 1920, h: 1080, frame: 8467200000, vtracks: [], atracks: [] };

/* ---------- 그리기: 고른 곳을 파랗게 덮는다. 붓은 바뀐 칸만 다시 그린다 ---------- */
let ovCtx, ovImg;
function render(x0 = 0, y0 = 0, x1 = st.W, y1 = st.H) {
  x0 = Math.max(0, x0 | 0); y0 = Math.max(0, y0 | 0); x1 = Math.min(st.W, Math.ceil(x1)); y1 = Math.min(st.H, Math.ceil(y1)); if (x1 <= x0 || y1 <= y0) return;
  const d = ovImg.data, m = st.mask;
  for (let y = y0; y < y1; y++) for (let x = x0, i = y * st.W + x0; x < x1; x++, i++) { const k = i * 4; if (m[i]) { d[k] = 31; d[k + 1] = 110; d[k + 2] = 230; d[k + 3] = 110; } else d[k + 3] = 0; }
  ovCtx.putImageData(ovImg, 0, 0, x0, y0, x1 - x0, y1 - y0); drawPoints();
}
function drawPoints() { if (!st.sess) return; const r = Math.max(4, st.W / 220); for (const p of st.sess.pts) { ovCtx.beginPath(); ovCtx.arc(p.x, p.y, r, 0, 7); ovCtx.fillStyle = p.label ? '#1baf7a' : '#e0433a'; ovCtx.fill(); ovCtx.lineWidth = r / 3; ovCtx.strokeStyle = '#fff'; ovCtx.stroke(); } }
const count = () => { let n = 0; for (const v of st.mask) if (v) n++; return n; };
const status = extra => say(`${st.name} · ${st.W}×${st.H} · 고른 부분 ${Math.round(count() / (st.W * st.H) * 100)}%` + (extra ? ' · ' + extra : ''));

/* ---------- 사진 넣기 ---------- */
async function load(f) {
  err(''); st.name = f.name.replace(/\.[^.]+$/, ''); if (st.url) URL.revokeObjectURL(st.url); st.url = URL.createObjectURL(f);
  const im = new Image(); im.src = st.url; await im.decode();
  st.W = im.naturalWidth; st.H = im.naturalHeight; const cv = $('cv'), ov = $('ov'); cv.width = ov.width = st.W; cv.height = ov.height = st.H;
  const c = cv.getContext('2d', { willReadFrequently: true }); c.drawImage(im, 0, 0); st.px = c.getImageData(0, 0, st.W, st.H).data;
  ovCtx = ov.getContext('2d'); ovImg = ovCtx.createImageData(st.W, st.H); st.mask = new Uint8Array(st.W * st.H); st.undo = []; st.sess = null; st.ai = null; st.prev = false; $('chips').textContent = '';
  $('tools').hidden = $('stage').hidden = false; $('stage').classList.remove('check'); render(); status('AI가 사진을 분석하는 중… (붓·색상은 바로 쓸 수 있습니다)');
  embed().then(() => status('AI 준비됨: 물체를 누르세요'), e => { st.ai = null; err('AI를 불러오지 못했습니다(인터넷 연결을 확인하세요). 붓·색상 선택은 그대로 쓸 수 있습니다.\n' + e.message); status(''); });
}
$('btnPick').onclick = () => $('file').click();
$('file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) load(f); };
const dz = $('drop'); dz.ondragover = e => { e.preventDefault(); dz.classList.add('on'); }; dz.ondragleave = () => dz.classList.remove('on');
dz.ondrop = e => { e.preventDefault(); dz.classList.remove('on'); const f = [...e.dataTransfer.files].find(x => /^image\//.test(x.type)); if (f) load(f); else err('사진 파일(PNG·JPG)을 넣어 주세요.'); };

/* ---------- 도구 고르기 ---------- */
function setTool(t) { st.tool = t; document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t)); $('slBrush').hidden = t !== 'brush'; $('slTol').hidden = t !== 'color'; if (t !== 'ai') endSession(); }
function setOp(o) { st.op = o; document.querySelectorAll('[data-op]').forEach(b => b.classList.toggle('on', b.dataset.op === o)); }
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
document.querySelectorAll('[data-op]').forEach(b => b.onclick = () => setOp(b.dataset.op));
function endSession() { if (st.sess) { st.sess = null; render(); } }
$('btnNext').onclick = () => { endSession(); status('다음 물체를 누르세요'); };

/* ---------- 화면 좌표 → 사진 좌표 ---------- */
const at = e => { const r = $('ov').getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * st.W, y: (e.clientY - r.top) / r.height * st.H, k: st.W / r.width }; };

/* ---------- AI 클릭: 한 물체에 점을 여러 개 찍어 다듬는다(왼쪽=넣기, 오른쪽=빼기) ---------- */
let busy = false;
async function aiClick(p, label, box) {
  if (busy) return; busy = true;
  try {
    if (!st.sess) { st.sess = { base: st.mask.slice(), pts: [], op: st.op, box: box || null }; }
    snap(); st.sess.pts.push({ x: p.x, y: p.y, label }); render(); status('윤곽을 잡는 중…');
    const m = await samMask(st.sess.pts, st.sess.pts.length === 1 ? st.sess.box : null); combine(m, st.sess.op, st.sess.base); render(); status(`점 ${st.sess.pts.length}개 · 오른쪽 클릭으로 빼고 싶은 곳을 누르거나 "다음 물체"`);
  } catch (e) { err('AI로 잡지 못했습니다: ' + e.message); }
  busy = false;
}

/* ---------- 붓 ---------- */
function paint(p, last) {
  const r = +$('brush').value / 2 * p.k, v = st.op === 'add' ? 255 : 0, m = st.mask, steps = last ? Math.ceil(Math.hypot(p.x - last.x, p.y - last.y) / Math.max(1, r / 3)) : 0;
  let x0 = Infinity, y0 = Infinity, x1 = -1, y1 = -1;
  for (let s = 0; s <= steps; s++) {
    const cx = last ? last.x + (p.x - last.x) * s / Math.max(1, steps) : p.x, cy = last ? last.y + (p.y - last.y) * s / Math.max(1, steps) : p.y;
    for (let y = Math.max(0, Math.floor(cy - r)); y <= Math.min(st.H - 1, Math.ceil(cy + r)); y++) { const dx = Math.sqrt(Math.max(0, r * r - (y - cy) ** 2)); for (let x = Math.max(0, Math.floor(cx - dx)); x <= Math.min(st.W - 1, Math.ceil(cx + dx)); x++) m[y * st.W + x] = v; }
    x0 = Math.min(x0, cx - r); y0 = Math.min(y0, cy - r); x1 = Math.max(x1, cx + r); y1 = Math.max(y1, cy + r);
  }
  render(x0 - 1, y0 - 1, x1 + 2, y1 + 2);
}

/* ---------- 색상: 누른 곳과 색 차이가 허용 범위 안인 곳 (이어진 부분만 또는 사진 전체) ---------- */
function colorPick(p) {
  const W = st.W, H = st.H, px = st.px, i0 = (Math.floor(p.y) * W + Math.floor(p.x)) * 4, r0 = px[i0], g0 = px[i0 + 1], b0 = px[i0 + 2], tol = (+$('tol').value) ** 2 * 3;
  const near = i => { const k = i * 4, dr = px[k] - r0, dg = px[k + 1] - g0, db = px[k + 2] - b0; return dr * dr + dg * dg + db * db <= tol; };
  const sel = new Uint8Array(W * H);
  if ($('contig').checked) { const stack = [Math.floor(p.y) * W + Math.floor(p.x)]; sel[stack[0]] = 1;
    while (stack.length) { const i = stack.pop(), x = i % W; for (const j of [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, i - W, i + W]) if (j >= 0 && j < W * H && !sel[j] && near(j)) { sel[j] = 1; stack.push(j); } } }
  else for (let i = 0; i < W * H; i++) if (near(i)) sel[i] = 1;
  snap(); combine(sel, st.op); render(); status('색상으로 골랐습니다');
}

/* ---------- 마우스 ---------- */
let drag = null;
$('ov').addEventListener('contextmenu', e => e.preventDefault());
$('ov').addEventListener('pointerdown', e => {
  if (st.prev) return; const p = at(e);
  if (st.tool === 'ai') { aiClick(p, e.button === 2 ? 0 : 1); return; }
  if (st.tool === 'color') { colorPick(p); return; }
  snap(); drag = p; $('ov').setPointerCapture(e.pointerId); paint(p, null);
});
$('ov').addEventListener('pointermove', e => { if (!drag) return; const p = at(e); paint(p, drag); drag = p; });
$('ov').addEventListener('pointerup', () => { if (drag) { drag = null; status(); } });

/* ---------- 자동 찾기: 사진 속 물체 목록 → 누르면 그 물체를 AI로 잡는다 ---------- */
$('btnAuto').onclick = async () => {
  if (busy) return; busy = true; err(''); $('btnAuto').disabled = true; status('사진 속 물체를 찾는 중… (처음엔 10초쯤 걸립니다)');
  try {
    if (!det) det = await (await lib()).pipeline('object-detection', 'Xenova/yolos-tiny');
    const found = (await det(st.url, { threshold: 0.6, percentage: false })).sort((a, b) => b.score - a.score);
    const box = $('chips'); box.textContent = '';
    if (!found.length) status('찾은 물체가 없습니다. AI 클릭으로 직접 눌러 주세요.');
    found.forEach(f => { const b = document.createElement('button'); b.textContent = (LABEL[f.label] || f.label) + ' ' + Math.round(f.score * 100) + '%';
      b.onclick = async () => { const { xmin, ymin, xmax, ymax } = f.box; setTool('ai'); endSession(); await aiClick({ x: (xmin + xmax) / 2, y: (ymin + ymax) / 2 }, 1, f.box); };
      box.append(b); });
    if (found.length) status(`물체 ${found.length}개를 찾았습니다. 목록에서 고르세요 (고른 뒤 AI 클릭으로 다듬을 수 있습니다)`);
  } catch (e) { err('자동 찾기를 하지 못했습니다: ' + e.message); }
  $('btnAuto').disabled = false; busy = false;
};

/* ---------- 되돌리기 · 반전 · 지우기 ---------- */
$('btnUndo').onclick = () => { const u = st.undo.pop(); if (!u) return; st.mask.set(u); if (st.sess && st.sess.pts.length) st.sess.pts.pop(); render(); status(); };
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !$('tools').hidden) { e.preventDefault(); $('btnUndo').click(); } });
$('btnInvert').onclick = () => { endSession(); snap(); for (let i = 0; i < st.mask.length; i++) st.mask[i] = st.mask[i] ? 0 : 255; render(); status(); };
$('btnClear').onclick = () => { endSession(); snap(); st.mask.fill(0); render(); status(); };

/* ---------- 결과: 가장자리를 살짝 흐린 투명 PNG ---------- */
function alphaOf() {
  const r = +$('feather').value, W = st.W, H = st.H; let a = Float32Array.from(st.mask); if (!r) return a;
  const pass = (src, horiz) => { const out = new Float32Array(W * H); for (let o = 0; o < (horiz ? H : W); o++) { let sum = 0, n = 0; const len = horiz ? W : H, idx = k => horiz ? o * W + k : k * W + o;
      for (let k = -r; k < len + r; k++) { if (k + r < len) { sum += src[idx(k + r)]; n++; } if (k - r - 1 >= 0) { sum -= src[idx(k - r - 1)]; n--; } if (k >= 0 && k < len) out[idx(k)] = sum / n; } } return out; };
  return pass(pass(a, true), false);
}
function cutout() {
  const c = document.createElement('canvas'); c.width = st.W; c.height = st.H; const x = c.getContext('2d'), im = x.createImageData(st.W, st.H), a = alphaOf();
  im.data.set(st.px); for (let i = 0; i < a.length; i++) im.data[i * 4 + 3] = Math.round(a[i]); x.putImageData(im, 0, 0); return c;
}
$('btnPrev').onclick = () => {
  st.prev = !st.prev; $('btnPrev').classList.toggle('on', st.prev); $('stage').classList.toggle('check', st.prev);
  const c = $('cv').getContext('2d');
  if (st.prev) { endSession(); c.clearRect(0, 0, st.W, st.H); c.drawImage(cutout(), 0, 0); ovCtx.clearRect(0, 0, st.W, st.H); status('미리보기 중 (다시 누르면 고르기로 돌아갑니다)'); }
  else { const im = c.createImageData(st.W, st.H); im.data.set(st.px); c.putImageData(im, 0, 0); render(); status(); }
};
$('btnSave').onclick = async () => {
  if (!count()) return err('고른 부분이 없습니다.'); err('');
  const blob = await new Promise(r => cutout().toBlob(r, 'image/png')), name = st.name + '_누끼.png';
  if (window.__testSave) { window.__saved = { name, size: blob.size }; return status(name + ' 로 저장했습니다'); }
  if (window.showSaveFilePicker) { try { const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: 'PNG 사진', accept: { 'image/png': ['.png'] } }] }); const w = await h.createWritable(); await w.write(blob); await w.close(); return status(h.name + ' 로 저장했습니다'); } catch (e) { if (e && e.name === 'AbortError') return status('저장을 취소했습니다'); } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove(); status(name + ' 로 받았습니다');
};
</script>

</body>
</html>
