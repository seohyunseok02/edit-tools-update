<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>편집 도구 모음</title>
<style>
/* 위쪽 탭 줄에서 편집기를 고르면 아래에 그 편집기가 열린다. 한 번 연 편집기는 탭을 옮겨도 작업 내용이 그대로 남는다. */
:root{--bg:#eef0f4;--panel:#fbfcfe;--ink:#171b24;--mute:#4f5868;--line:#d2d8e2;--accent:#1f5fbf;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--panel:#181c26;--ink:#e6eaf2;--mute:#98a2b5;--line:#2b3140;--accent:#7fb0ff;--accent-ink:#0a1830;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.4 "Malgun Gothic",system-ui,sans-serif}
nav{display:flex;gap:4px;align-items:center;padding:8px 12px 0;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
nav b{margin-right:12px;font-size:15px}
nav button{font:inherit;color:var(--mute);background:none;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;padding:8px 16px;cursor:pointer}
nav button:hover{color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
nav button[aria-selected=true]{color:var(--ink);font-weight:700;background:var(--bg);border-color:var(--line);box-shadow:inset 0 3px 0 var(--accent)}
#ver{margin-left:auto;color:var(--mute);font-size:12px;padding:0 4px}
#upd{font:inherit;font-weight:700;color:var(--accent-ink);background:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:6px 14px;margin-bottom:6px;cursor:pointer}
.learn{font:inherit;font-size:12px;color:var(--mute);background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin:0 0 6px auto;cursor:pointer}
.learn:hover{color:var(--ink)}
.learn[data-state=none],.learn[data-state=off]{color:var(--accent);border-color:var(--accent)}
.learn + #ver{margin-left:8px}
.learn + .learn{margin-left:8px}
#notify[aria-pressed=false]{color:var(--mute);border-style:dashed}
main{flex:1;min-height:0;position:relative}

iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
iframe[hidden]{display:none}
</style>
</head>
<body>
<nav role="tablist" aria-label="편집기"><b>편집 도구 모음</b></nav>
<main id="main"></main>
<script>
'use strict';
const TOOLS = [['cut', '컷편집'], ['fx', '효과자막'], ['spell', '맞춤법 검사'], ['highlight', '하이라이트'], ['shorts', '쇼츠'], ['extract', '추출쇼츠'], ['subtitle', '소제목'], ['subtime', '자막 타이밍'], ['thumb', '썸네일 캡쳐'], ['fonts', '글꼴 점검'], ['stats', '학습 현황']];
const nav = document.querySelector('nav'), main = document.getElementById('main'), frames = {};
function open(id) {
  for (const [k] of TOOLS) { document.getElementById('tab-' + k).setAttribute('aria-selected', String(k === id)); if (frames[k]) frames[k].hidden = k !== id; }
  if (!frames[id]) { const f = document.createElement('iframe'); f.src = 'pages/' + id + '.html'; f.title = TOOLS.find(t => t[0] === id)[1]; main.append(f); frames[id] = f; }
  try { localStorage.setItem('hub-tab', id); } catch {}
}
for (const [id, name] of TOOLS) { const b = document.createElement('button'); b.id = 'tab-' + id; b.type = 'button'; b.setAttribute('role', 'tab'); b.textContent = name; b.onclick = () => open(id); nav.append(b); }
// 버전 표시와 새 버전 알림 (프로그램 안에서만; 예전 프로그램 틀에는 이 기능이 없을 수 있다)
const VER_LABEL = 'ver.1124.30'; // 배포할 때 publish-update.js 가 "ver.월일.번호"로 채운다
const ver = document.createElement('span'); ver.id = 'ver'; nav.append(ver);
if (window.appUpdate) {
  appUpdate.info().then(i => { ver.textContent = VER_LABEL.endsWith('.' + i.n) ? VER_LABEL : 'ver.' + i.n; }).catch(() => {});
  appUpdate.onReady(r => {
    if (document.getElementById('upd')) return; const b = document.createElement('button'); b.id = 'upd'; b.type = 'button';
    if (r.needInstall) { b.textContent = '새 설치 파일이 필요한 업데이트가 있습니다'; b.disabled = true; }
    else { b.textContent = '새 버전 ' + r.n + ' 받음 · 눌러서 적용'; b.title = '지금 작업 중인 내용은 사라집니다. 저장한 뒤 누르세요. 누르지 않아도 다음에 켤 때 적용됩니다.'; b.onclick = () => appUpdate.apply(); }
    nav.insertBefore(b, ver); ver.style.marginLeft = '8px'; b.style.marginLeft = document.getElementById('learn') ? '8px' : 'auto';
    st.ready = r.n || st.ready; toast(r.needInstall ? 'install' : 'ready', r.n, st.notes[r.n] || r.note || '');
  });
  // 켜 둔 동안에도 10분마다(그리고 창으로 돌아올 때) 새 버전이 올라왔는지 본다. 받는 일은 프로그램을 켤 때 프로그램 틀이 한다.
  const REMOTE = 'https://seohyunseok02.github.io/edit-tools-update/version.json';
  const st = { cur: 0, ready: 0, told: 0, notes: {} };
  try { st.told = +localStorage.getItem('upd-seen') || 0; } catch {} // 한 번 알린 버전은 프로그램을 다시 켜도 또 알리지 않는다
  // 알림 끄기: 끄면 Windows 알림만 안 뜨고, 위쪽 "눌러서 적용" 버튼과 다음에 켤 때 자동 적용은 그대로다
  const quiet = () => { try { return localStorage.getItem('upd-notify') === 'off'; } catch { return false; } };
  const nb = document.createElement('button'); nb.id = 'notify'; nb.type = 'button'; nb.className = 'learn';
  const drawN = () => { const off = quiet(); nb.textContent = off ? '🔕 업데이트 알림 꺼짐' : '🔔 업데이트 알림 켜짐'; nb.title = off ? '눌러서 업데이트 알림 켜기 (새 버전이 나오면 화면 오른쪽 아래에 알림)' : '눌러서 업데이트 알림 끄기 (꺼도 위쪽 적용 버튼과 자동 적용은 그대로)'; nb.setAttribute('aria-pressed', String(!off)); };
  nb.onclick = () => { try { localStorage.setItem('upd-notify', quiet() ? 'on' : 'off'); } catch {} drawN(); };
  drawN(); nav.insertBefore(nb, ver); nb.style.marginLeft = 'auto'; ver.style.marginLeft = '8px';
  appUpdate.info().then(i => { st.cur = i.n | 0; }).catch(() => {});
  async function poll() {
    try {
      const v = await (await fetch(REMOTE + '?t=' + Date.now(), { cache: 'no-store' })).json(); if (!v || !(v.n > 0)) return; st.notes[v.n] = v.note || '';
      if (st.cur && v.n > st.cur && v.n > st.ready && v.n > st.told) toast('remote', v.n, v.note || '');
    } catch (e) {}
  }
  setTimeout(poll, 60 * 1000); setInterval(poll, 10 * 60 * 1000);
  let lastFocus = 0; window.addEventListener('focus', () => { if (Date.now() - lastFocus > 5 * 60 * 1000) { lastFocus = Date.now(); poll(); } });
  /* Windows 알림(화면 오른쪽 아래, 카톡 알림처럼): ready = 받아 둠(바로 적용 가능), remote = 올라옴(껐다 켜면 받음), install = 새 설치 파일 필요.
     알림을 누르면 프로그램 창이 앞으로 나오고, 위쪽 "눌러서 적용" 버튼으로 적용한다(작업 중인 내용이 사라질 수 있어 알림에서 바로 적용하지 않는다). */
  function toast(kind, n, note) {
    if ((n | 0) <= st.told) return; // 이 버전은 이미 알림 (받음·올라옴 어느 쪽이든 한 번만)
    if (quiet()) return; // 알림을 꺼 두었으면 띄우지 않는다(켰을 때 아직 안 알린 버전은 알린다)
    st.told = n | 0; try { localStorage.setItem('upd-seen', String(st.told)); } catch {} if (typeof Notification !== "function") return;
    const title = kind === "install" ? "편집 도구 모음 · 새 설치 파일이 필요한 업데이트" : `편집 도구 모음 · 새 버전 ${n}${kind === "ready" ? " 받음" : "이 나왔습니다"}`;
    const how = kind === "ready" ? "프로그램 위쪽의 \"눌러서 적용\"을 누르면 바로 적용됩니다(다음에 켤 때도 적용됩니다)." : kind === "remote" ? "프로그램을 껐다 켜면 받아서 적용할 수 있습니다." : "관리자에게 새 설치 파일을 받아 설치해 주세요.";
    const show = () => { try { const x = new Notification(title, { body: (note ? note.slice(0, 160) + " / " : "") + how, tag: "edit-tools-update-" + n }); x.onclick = () => { try { window.focus(); } catch (e) {} x.close(); }; } catch (e) {} };
    if (Notification.permission === "granted") show(); else if (Notification.permission !== "denied") Notification.requestPermission().then(p => { if (p === "granted") show(); }).catch(() => {});

  }
}
// 공유 학습 폴더: 사람들이 고친 내용을 팀이 같이 쓰는 곳 (사무실 나스). 정하지 않으면 이 PC에만 쌓인다.
if (window.learnApi) {
  const b = document.createElement('button'); b.id = 'learn'; b.type = 'button'; b.className = 'learn';
  const draw = c => { b.textContent = !c || !c.dir ? '공유 학습 폴더 정하기' : c.ok ? '학습 공유 중' : '학습 폴더 연결 안 됨'; b.title = !c || !c.dir ? '사람들이 고친 내용을 팀이 함께 쓰려면 사무실 나스의 공용 폴더를 골라 주세요. 정하지 않으면 이 PC에서 고친 것만 배웁니다.' : (c.ok ? '' : '지금은 이 폴더에 연결되지 않아 이 PC에만 쌓아 두고, 연결되면 올립니다.\n') + c.dir + '\n눌러서 바꾸기'; b.dataset.state = !c || !c.dir ? 'none' : c.ok ? 'ok' : 'off'; };
  b.onclick = () => learnApi.pick().then(c => { if (c) draw(c); }).catch(() => {});
  learnApi.config().then(draw).catch(() => {}); nav.insertBefore(b, ver);
}
let last = null; try { last = localStorage.getItem('hub-tab'); } catch {}
open(TOOLS.some(t => t[0] === last) ? last : 'fx');
</script>
</body>
</html>
